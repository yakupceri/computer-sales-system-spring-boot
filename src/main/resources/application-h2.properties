# H2 bellek içi veritabanı (öğrenme / geliştirme için)
spring.datasource.url=jdbc:h2:mem:computer_sales
spring.datasource.username=sa
spring.datasource.password=

# Tarayıcıdan veritabanına bakmak için H2 konsolu
spring.h2.console.enabled=true

# Uygulama açılınca tabloları oluştur, kapanınca sil
spring.jpa.hibernate.ddl-auto=create-drop

# Demo verisi: tablolar oluştuktan sonra data-h2.sql dosyasını yükle
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-h2.sql
spring.sql.init.encoding=UTF-8
