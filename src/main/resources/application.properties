spring.application.name=computer-sales-system
# MySQL bağlantı bilgileri (ortam değişkenlerinden okunur)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/computer_sales?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# JPA ayarları
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
